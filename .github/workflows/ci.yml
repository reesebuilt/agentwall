name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

# Workflow-wide floor. A job added later that forgets its own block inherits read-only
# instead of the repository default, which on many repositories is read-write: a compromised
# step would otherwise hold a token that can push commits, move tags, or open releases.
permissions:
  contents: read

jobs:
  # Job ids are the check-run names branch protection matches, so none of these jobs sets a
  # display `name`. Renaming `test` would silently detach it from the required-check rule.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout writes the job's GITHUB_TOKEN into .git/config as an auth header and
          # leaves it there for every step that follows. The steps that follow are npm ci,
          # a TypeScript build, and jest, all of which execute code from the dependency
          # tree. A read-only token is still a credential, and nothing here pushes, so it
          # has no reason to be sitting on disk where that code can read it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit (high+)
        run: npm audit --audit-level=high

  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: verifier
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; see the test job for why the token is not persisted.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain comes from the module's own go directive. A hardcoded version here
          # drifts from go.mod without anything noticing, and CI then proves the verifier
          # builds under a Go nobody claims to support.
          go-version-file: verifier/go.mod
          # Zero requirements means no dependency graph to cache and no go.sum for the cache
          # key to hash. setup-go's cache path wants that file and warns when it is absent.
          cache: false

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The README says the verifier carries no third-party code. A claim nobody checks is a
      # claim that rots: one stray `go get` turns the sentence into a lie that reads exactly
      # like the truth. `go list -m all` prints the main module plus every module in the
      # build list, so a single line is the whole assertion.
      - name: Zero third-party dependencies
        run: |
          modules=$(go list -m all)
          count=$(printf '%s\n' "$modules" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "the verifier module must have no requirements; go list -m all printed $count lines:" >&2
            echo "$modules" >&2
            exit 1
          fi
          echo "$modules"

      - name: Build
        run: go build -o agentwall-verify .

      - name: Upload verifier binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentwall-verify-ci
          path: verifier/agentwall-verify
          # An upload that silently matches nothing leaves a green job and no artifact, which
          # is the failure mode this step exists to make visible.
          if-no-files-found: error

  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; see the test job for why the token is not persisted.
          # The corpus reproduction step below uses git for local status and diff only,
          # neither of which needs a credential.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: verifier/go.mod
          cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build verifier
        run: go build -o agentwall-verify .
        working-directory: verifier

      # Runs the committed corpus, the bytes a stranger gets from a checkout, through every
      # implementation this checkout contains. The harness exits non-zero on any failure and
      # zero when the only differences are the divergences declared in its DIVERGENCES table;
      # it also fails when a declared divergence stops happening, so the table cannot absorb a
      # fixed gap. The Python verifier needs no build step, so it joins the run from the
      # checkout. An implementation whose source tree is absent prints a note and sits out; one
      # whose source is present and whose binary is missing is a hard failure.
      #
      # Do not add a CONFORMANCE_SKIP_* variable to this step. They exist so a contributor
      # without a Go or Rust toolchain can still run the harness locally, and setting one here
      # would shrink the cross-comparison while every job stayed green, because each verifier
      # also has its own job that tests it alone. Agreement between implementations is the
      # thing this step buys that those jobs cannot; a skip spends it to make a red build go
      # away. If a verifier cannot build in CI, fix the build or delete the verifier.
      - name: Conformance
        run: node scripts/conformance.js

      # Regeneration must reproduce the committed tree byte for byte. Ordered after the
      # harness so the generator cannot overwrite the bytes the harness is supposed to judge.
      - name: Corpus reproduces from the generator
        run: |
          npm run gen:corpus
          changed=$(git status --porcelain -- verifier/testdata/corpus)
          if [ -n "$changed" ]; then
            echo "regenerating the corpus does not reproduce the committed tree." >&2
            echo "either the generator is nondeterministic or the corpus was edited by hand:" >&2
            echo "$changed" >&2
            git --no-pager diff -- verifier/testdata/corpus >&2
            exit 1
          fi

  verifier-py:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: verifier-py
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      # The verifier itself has no dependencies and that is a property, not an omission:
      # importing cryptography for Ed25519 would route its signature check through the same
      # OpenSSL the bundled TypeScript verifier uses, and two implementations that share a
      # library share its bugs. pytest is a test-time tool and is installed here alone.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Test
        run: python -m pytest -q

      # The README says the verifier carries no third-party code. A claim nobody checks is a
      # claim that rots, and the obvious spelling of this check rots quietly: importing the
      # package and seeing it succeed only proves nothing third-party is MISSING from the
      # runner. It passes the moment an image, or a test dependency, happens to ship the
      # module the package should not be importing. So the imports are read out of the source
      # and checked against sys.stdlib_module_names, which is compiled into the interpreter
      # and does not care what is installed. The runtime import stays, because it catches the
      # syntax errors and import cycles a static read does not.
      - name: No runtime dependencies
        run: |
          python - <<'EOF'
          import ast, pathlib, sys, tomllib

          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          declared = config["project"]["dependencies"]
          if declared:
              sys.exit("verifier-py must declare no dependencies; pyproject lists %r" % (declared,))

          allowed = set(sys.stdlib_module_names) | {"agentwall_verify"}
          for path in sorted(pathlib.Path("agentwall_verify").rglob("*.py")):
              for node in ast.walk(ast.parse(path.read_text(encoding="utf-8"))):
                  if isinstance(node, ast.ImportFrom):
                      if node.level:
                          continue
                      roots = [(node.module or "").split(".")[0]]
                  elif isinstance(node, ast.Import):
                      roots = [alias.name.split(".")[0] for alias in node.names]
                  else:
                      continue
                  for root in roots:
                      if root not in allowed:
                          sys.exit("%s imports %r, which is not in the standard library" % (path, root))
          print("every import in agentwall_verify resolves to the standard library")
          EOF
          python -c "import agentwall_verify.cli, agentwall_verify.evidence, agentwall_verify.ed25519"

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every `uses:` in this directory resolves a git ref at run time. A tag is mutable, so
      # a tag pin lets whoever owns that action choose what executes in our jobs, holding our
      # token, after the code was reviewed. The pins already in these files are only worth as
      # much as their upkeep, and a pin that decays back to a tag looks like an ordinary line
      # in a diff, so a check reads all of them on every pull request instead of trusting
      # that nobody forgets. The script needs no install and no dependencies: a guard on the
      # supply chain that runs third-party code to do its job has moved the problem, not
      # solved it. Node is preinstalled on the runner image, so a checkout is the whole setup.
      - name: Actions are pinned to commit SHAs
        run: node scripts/check-workflow-pins.js
