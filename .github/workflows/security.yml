name: Security

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks walks git history. The default shallow clone leaves it without the
          # commits to scan, and it fails with "stderr is not empty" rather than saying
          # so. A secret scan that errors out is indistinguishable from one that passes
          # if nobody reads the log, so fetch the full history it actually needs.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
      - name: Run gitleaks
        # The gitleaks ACTION computes a git range from the push event as
        # <oldest-commit>^..<newest>. On a fresh repository's first push the oldest commit
        # IS the root, its parent does not exist, and the scan dies with "unknown
        # revision" — a scanner erroring out is indistinguishable from one passing unless
        # someone reads the log. Run the binary directly over full history instead; the
        # checkout above fetches it.
        run: "$RUNNER_TEMP/gitleaks" detect --redact --source . --config .gitleaks.toml --verbose

  dependency-audit:
    name: Dependency audit (moderate+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=moderate

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
