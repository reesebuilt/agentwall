# An allowlist with no rules REPLACES the default ruleset rather than extending it, and a
# scanner that matches nothing reports a clean tree forever. Extending keeps the defaults
# and applies the allowlist below on top of them.
[extend]
useDefault = true

[allowlist]
# A DLP engine has to contain secret-shaped strings to be testable. Allowlist the exact
# literals, not whole directories: broad `tests/.*` or `docs/.*` path globs switch secret
# scanning off across most of the repo, which defeats the point of running it.
#
# AKIAIOSFODNN7EXAMPLE is AWS's own documentation key. FAKE_GITHUB_PAT_EXAMPLE is a
# placeholder that replaced a PAT-shaped string which used to trip scanners.
description = "Allow the specific fake secrets this repo needs in order to test detection"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''FAKE_GITHUB_PAT_EXAMPLE''',
  '''sk-test-1234567890''',
  '''alice@example.com''',
  # The DLP engine's own github-pat detector needs a PAT-shaped literal to detect.
  '''ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789'''
]

# The conformance corpus signs synthetic checkpoints, so it has to carry the private key
# that signed them: a verifier cannot be shown to reject a forged signature without a real
# one to compare against. The pattern stays narrow, one filename under one testdata tree,
# rather than excusing a directory. These keys sign synthetic corpus data and secure nothing.
paths = [
  '''verifier/testdata/.*checkpoint-key\.pem'''
]
