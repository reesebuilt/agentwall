# Agentwall configuration example
# Copy to agentwall.config.yaml and customize

port: 3000
host: "127.0.0.1"
logLevel: "info"

dashboard:
  # Optional canonical public URL used in the Knowledge Base access panel.
  # publicBaseUrl: "https://mission-control.example.com"

approval:
  mode: "auto"
  timeoutMs: 30000
  backend: "file"
  persistencePath: "./agentwall-approvals.json"
  # Optional operator webhook for queued/resolved approval notifications.
  # Receives JSON events: approval.pending and approval.resolved.
  # webhookUrl: "https://operator.example/webhooks/agentwall-approvals"

policy:
  # "allow" or "deny". Anything else is refused at start-up: an unrecognised value used to
  # become the decision for every unmatched request, and nothing downstream treats an unknown
  # decision as a block, so a typo here failed open.
  defaultDecision: "deny"
  # Optional external policy file. When present, Agentwall loads it at startup, hot-reloads
  # changes from disk, and re-reads it on SIGHUP or POST /reload. Rules reload whole; a file
  # that fails to validate is refused and the previous ruleset keeps enforcing.
  #
  # Most keys in THIS file are not reloadable: only logLevel and policy.defaultDecision apply
  # to a running process, and a reload names every other changed key as restart-required. See
  # docs/reload.md.
  configPath: "./examples/policy.yaml"

dlp:
  enabled: true
  redactSecrets: true

egress:
  enabled: true
  defaultDeny: true
  allowPrivateRanges: false
  allowedHosts:
    - "api.openai.com"
  allowedSchemes:
    - "https"
  allowedPorts:
    - 443

manifestIntegrity:
  enabled: true
  # approvedHashesPath: "./approved-manifests.json"

watchdog:
  enabled: true
  staleAfterMs: 15000
  timeoutMs: 30000
  killSwitchMode: "deny_all"
